# 消费分类受控词表（两级）
#
# 一级分类：受控，LLM 只能从中选择，不得自创。
# 二级分类：自由文本，按需细化；留空也可以。常见取值列在 l2_hint 里作为参考。
#
# 变更规则：一级分类只增不改（改名会切断历史数据的时间序列）。

primary:
  - key: 餐饮
    desc: 吃饭、外卖、买菜
    l2_hint: [日常, 社交, 外卖, 买菜, 咖啡饮品]

  - key: 交通
    desc: 通勤与出行
    l2_hint: [地铁公交, 打车, 加油, 停车, 高速, 火车, 机票]

  - key: 购物
    desc: 买东西
    l2_hint: [日用, 数码, 服饰, 美妆, 家居]

  - key: 居住
    desc: 住相关的固定支出
    l2_hint: [房租, 房贷, 水电燃气, 物业, 宽带]

  - key: 医疗
    desc: 看病、买药、体检
    l2_hint: [门诊, 药品, 体检, 牙科, 保险]

  - key: 娱乐
    desc: 休闲娱乐与订阅
    l2_hint: [电影, 游戏, 演出, 会员订阅, 旅游]

  - key: 学习
    desc: 教育、书籍、课程
    l2_hint: [书籍, 网课, 培训, 考试]

  - key: 人情往来
    desc: 红包、礼金、赠送
    l2_hint: [红包, 份子钱, 礼物, 孝敬父母]

  - key: 健身
    desc: 运动相关支出
    l2_hint: [健身房, 私教, 装备, 赛事]

  - key: 其他
    desc: 无法归入以上任何一类时的兜底
    l2_hint: []

# 支出平台（受控，与数据库 CHECK 约束一致）
platforms:
  - 支付宝
  - 微信
  - 现金
  - 信用卡
  - 其他

# 不确定时的处理
fallback: 其他
