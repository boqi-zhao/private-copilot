# 消费分类受控词表
# LLM 只能从 primary 中选择，不得自创。无法归类一律用 "其他"。
#
# 变更规则：只增不改。改名会切断历史数据的时间序列。

primary:
  - key: 餐饮-日常
    desc: 自己日常吃饭、外卖、买菜做饭
    examples: [工作餐, 外卖, 超市买菜, 便利店食品]

  - key: 餐饮-社交
    desc: 与他人一起、金额明显偏高的就餐
    examples: [请客, 聚餐, 约会吃饭, 酒局]

  - key: 交通
    desc: 通勤与出行
    examples: [地铁, 公交, 打车, 加油, 停车费, 高速费, 火车票, 机票]

  - key: 购物-日用
    desc: 日常生活消耗品
    examples: [纸巾, 洗护, 清洁用品, 衣物鞋帽]

  - key: 购物-数码
    desc: 电子产品与配件
    examples: [手机, 电脑, 耳机, 充电器, 配件]

  - key: 医疗
    desc: 看病、买药、体检、健康相关支出
    examples: [挂号, 门诊, 药店, 体检费, 牙科]
    note: 医院缴费单即使同时含健康信息，也归此类记账（健康指标另走 health-report）

  - key: 居住
    desc: 房租、房贷、水电燃气、物业
    examples: [房租, 水费, 电费, 燃气费, 物业费, 宽带]

  - key: 娱乐
    desc: 休闲娱乐与订阅
    examples: [电影, 游戏, 演出, 会员订阅, 旅游门票]

  - key: 学习
    desc: 教育、书籍、课程
    examples: [买书, 网课, 培训, 考试报名]

  - key: 人情往来
    desc: 红包、礼金、赠送
    examples: [红包, 份子钱, 礼物, 孝敬父母]

  - key: 健身
    desc: 运动相关支出
    examples: [健身房, 私教课, 运动装备, 赛事报名]
    note: 私教课/运动装备属于支出，归此类记账（运动记录另走 workout）

  - key: 其他
    desc: 无法归入以上任何一类时的兜底
    note: 归入此类时必须在回复中说明理由

# 不确定时的处理
fallback: 其他
